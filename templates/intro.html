<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Connect - Intro</title>
    <meta name="description" content="Welcome to Meal Connect. Let's get started." />
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/intro.css') }}" />
  </head>
  <body>
    <!-- Fallback Background (Visible if video fails) -->
    <div id="fallback-bg" class="fallback-bg">
      <h1 class="logo">Meal Connect</h1>
    </div>

    <!-- Background Video -->
    <video id="intro-video" class="intro-video" src="{{ url_for('static', filename='videos/intro.mp4') }}" autoplay muted playsinline loop></video>
    
    <!-- Dark overlay to ensure button and text remain readable -->
    <div class="video-overlay"></div>

    <!-- Content overlay -->
    <div class="content-container">
      <button id="lets-go-btn" class="lets-go-btn">Let's Go</button>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/intro.js') }}"></script>
  </body>
</html>
