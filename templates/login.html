<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meal Connect - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-box {
      width: 100%;
      max-width: 450px;
      padding: 3rem;
      border-radius: 24px;
    }
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-body);
      outline: none;
      transition: var(--transition);
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(46,204,113,0.2);
    }
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
    .alert.error { background: rgba(231, 76, 60, 0.2); color: #ff6b6b; border: 1px solid rgba(231, 76, 60, 0.3); }
    .alert.success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
  </style>
</head>
<body>
  <div class="bg-glow glow-top-right"></div>
  <div class="auth-container">
    <div class="auth-box glass text-center">
      <a href="{{ url_for('home') }}" class="nav-logo" style="justify-content: center; margin-bottom: 2rem;">
        <i class="ri-leaf-line"></i> Meal Connect
      </a>
      <h2 class="section-title" style="font-size: 2rem;">Welcome Back</h2>
      <p class="section-subtitle" style="margin-bottom: 2rem;">Login to your establishment dashboard</p>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label>Email Address or Hotel ID</label>
          <input type="text" name="login_id" required placeholder="e.g. H001 or hotel@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 1rem;">Login</button>
      </form>
      <p style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary); text-decoration: none;">Sign Up</a>
      </p>
    </div>
  </div>
</body>
</html>
