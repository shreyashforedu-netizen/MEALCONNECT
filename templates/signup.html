<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meal Connect - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .auth-box {
      width: 100%;
      max-width: 650px;
      padding: 3rem;
      border-radius: 24px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      color: #fff;
      font-family: var(--font-body);
      outline: none;
      transition: var(--transition);
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }
    .form-group select option { background: #060b08; color: #fff; }
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
    .alert.error { background: rgba(231, 76, 60, 0.2); color: #ff6b6b; border: 1px solid rgba(231, 76, 60, 0.3); }
  </style>
</head>
<body>
  <div class="bg-glow glow-bottom-left"></div>
  <div class="auth-container">
    <div class="auth-box glass text-center">
      <a href="{{ url_for('home') }}" class="nav-logo" style="justify-content: center; margin-bottom: 1.5rem;">
        <i class="ri-leaf-line"></i> Meal Connect
      </a>
      <h2 class="section-title" style="font-size: 1.8rem;">Create an Account</h2>
      <p class="section-subtitle" style="margin-bottom: 2rem;">Join our network to reduce food waste</p>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('signup') }}">
        <div class="grid-2">
          <div class="form-group">
            <label>Hotel/Establishment Name</label>
            <input type="text" name="hotel_name" required>
          </div>
          <div class="form-group">
            <label>Owner/Manager Name</label>
            <input type="text" name="owner_name" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" required placeholder="10+ digit number">
          </div>
          <div class="form-group">
            <label>Establishment Type</label>
            <select name="hotel_type" required>
              <option value="Hotel">Hotel</option>
              <option value="Restaurant">Restaurant</option>
              <option value="Canteen">Canteen</option>
              <option value="Catering">Catering</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>City / Address</label>
            <input type="text" name="address" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 1rem;">Sign Up</button>
      </form>
      <p style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Already registered? <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none;">Login</a>
      </p>
    </div>
  </div>
</body>
</html>
